[project]
name = "smartintake"
version = "0.2.0"
description = "AI-assisted municipal 311 service request triage (SEG4105 term project prototype)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, simplify, McCabe complexity
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app", "etl"]
omit = ["etl/generate_history.py"]
branch = true

[tool.bandit]
exclude_dirs = ["tests"]
